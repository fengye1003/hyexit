# /etc/sysctl.d/99-hyexit.conf
# added by hyexit (tailscale exit node + clash) - no host traffic is proxied

net.ipv4.ip_forward = 1
net.ipv4.conf.all.forwarding = 1
# rp_filter=2 (loose): the forwarded client packets arrive on tailscale0 and leave through the TUN,
# and strict reverse-path filtering would drop the asymmetric returns.
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2

# IPv6 is optional: only add these when the VPS actually has a global IPv6 default route.
# net.ipv6.conf.all.forwarding = 1
# net.ipv6.conf.default.forwarding = 1
